/* =========================================================

function $(id){
    return document.getElementById(id);
}


function showToast(message){

    const toast = $('toast');

    if(!toast) return;

    toast.textContent = message;

    toast.classList.add('show');

    clearTimeout(
        window.__toastTimer
    );

    window.__toastTimer =
        setTimeout(()=>{

            toast.classList.remove(
                'show'
            );

        },3000);

}


function openModal(id){

    const modal = $(id);

    if(modal){
        modal.classList.add('show');
    }

}


function closeModal(id){

    const modal = $(id);

    if(modal){
        modal.classList.remove('show');
    }

}


/* =========================================================
   DEVICE
========================================================= */

function getDeviceId(){

    let device =
        localStorage.getItem(
            'platform_device_id'
        );

    if(!device){

        device =
            'DEV-' +
            crypto.randomUUID();

        localStorage.setItem(
            'platform_device_id',
            device
        );

    }

    return device;

}


/* =========================================================
   AUTH SESSION
========================================================= */

async function ensureStudentSession(){

    const {
        data,
        error
    } = await db.auth.getSession();


    if(error){
        throw error;
    }


    if(
        data &&
        data.session &&
        data.session.user
    ){

        return data.session.user;

    }


    const {
        data:anonymousData,
        error:anonymousError
    } =
        await db.auth.signInAnonymously();


    if(anonymousError){

        console.error(
            anonymousError
        );

        throw anonymousError;

    }


    return anonymousData.user;

}

/* =========================================================

========================================================= */

function openPage(page){

    document
        .querySelectorAll('.page')
        .forEach(el=>{

            el.classList.remove(
                'active'
            );

        });


    const target =
        $(page + '-page');


    if(target){

        target.classList.add(
            'active'
        );

    }


    document
        .querySelectorAll('.nav-item')
        .forEach(btn=>{

            btn.classList.remove(
                'active'
            );


            if(
                btn.dataset.page === page
            ){

                btn.classList.add(
                    'active'
                );

            }

        });


    window.scrollTo({
        top:0,
        behavior:'smooth'
    });


    if(page === 'lectures'){
        loadLectures();
    }


    if(page === 'exams'){
        loadExams();
    }


    if(page === 'teachers'){
        loadTeachers();
    }


    if(page === 'materials'){
        loadMaterials();
    }


    if(page === 'profile'){
        loadProfile();
    }

}

async function submitAttendance(){

    const name =
        $('attendance-name')

            .value;

        );

        return;

    }


    if(!grade){

        showToast(
            'اختر المرحلة الدراسية'
        );

        return;

    }


    if(!governorate){

        showToast(
            'اختر المحافظة'
        );

        return;

    }


    try{

        const user =
            await ensureStudentSession();


        if(!user){

            showToast(
                'تعذر إنشاء جلسة الطالب'
            );

            return;

        }


        const {
            data,
            error
        } =
            await db.rpc(
                'get_or_create_student',
                {
                    p_student_name:name,
                    p_governorate:governorate,
                    p_grade:grade
                }
            );


        if(error){

            console.error(error);

            showToast(
                'تعذر حفظ بيانات الطالب'
            );

            return;

        }


        currentStudent =
            data;


        localStorage.setItem(
            'student_name',
            name
        );

        localStorage.setItem(
            'student_governorate',
            governorate
        );

        localStorage.setItem(
            'student_grade',
            grade
        );

        localStorage.setItem(
            'student_number',
            data.student_number || ''
        );


        await registerLogin(
            'registration'
        );


        closeModal(
            'attendance-modal'
        );


        updateStudentUI();


        showToast(
            `أهلاً بك ${name} 🎓`
        );


        setTimeout(()=>{

            checkSubscription();

        },500);


    }catch(error){

        console.error(error);

        showToast(
            'تعذر تسجيل الدخول'
        );

    }

}

/* =========================================================
   SUBSCRIPTION
========================================================= */

function hasValidSubscription(){

    if(!currentStudent){

        return false;

    }


    if(
        !currentStudent.subscription_expires_at
    ){

        return false;

    }


    return (
        new Date(
            currentStudent.subscription_expires_at
        ).getTime() > Date.now()
    );

}


async function checkSubscription(){

    if(isAdmin){

        return true;

    }


    if(!currentStudent){

        await loadStudentProfile();

    }


    if(!currentStudent){

        openModal(
            'attendance-modal'
        );

        return false;

    }


    if(
        hasValidSubscription()
    ){

        return true;

    }


    openModal(
        'access-modal'
    );


    return false;

}


/* =========================================================

async function verifyActivationCode(){

    const input =
        $('activation-code')
            .value
            .trim()
            .toUpperCase();


    if(!input){

        showToast(
            'أدخل كود التفعيل'
        );

        return;

    }


    try{

        await ensureStudentSession();


        if(!currentStudent){

            await loadStudentProfile();

        }


        if(!currentStudent){

            showToast(
                'سجل الطالب غير موجود'
            );

            closeModal(
                'access-modal'
            );

            openModal(
                'attendance-modal'
            );

            return;

        }


        const {
            data,
            error
        } =
            await db.rpc(
                'redeem_activation_code',
                {
                    p_code:input,
                    p_device_id:getDeviceId()
                }
            );


        if(error){

            console.error(error);


            showToast(
                error.message ||
                'كود التفعيل غير صحيح'
            );

            return;

        }


        await loadStudentProfile();


        closeModal(
            'access-modal'
        );


        showToast(
            'تم تفعيل اشتراكك بنجاح 🎉'
        );


        await registerLogin(
            'activation'
        );


    }catch(error){

        console.error(error);

        showToast(
            'تعذر التحقق من الكود'
        );

    }

}

/* =========================================================
   MATERIALS
========================================================= */

async function loadMaterials(){

    const container =
        $('materials-container');


    if(!container) return;


    try{

        const {
            data,
            error
        } =
            await db
                .from('materials')
                .select('*')
                .order(
                    'created_at',
                    {
                        ascending:false
                    }
                );


        if(error){

            console.warn(error);

            return;

        }


        if(!data || !data.length){

            return;

        }


        container.innerHTML =
            '<div class="material-list"></div>';


        const list =
            container.querySelector(
                '.material-list'
            );


        data.forEach(
            material=>{

                list.appendChild(
                    createMaterialElement(
                        material
                    )
                );

            }
        );

    }catch(error){

        console.error(error);

    }

}


async function loadGradeMaterials(
    grade
){

    const container =
        $('grade-materials');


    container.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            جاري تحميل الملازم...

        </div>

    `;


    try{

        const {
            data,
            error
        } =
            await db
                .from('materials')
                .select('*')
                .eq('grade',grade)
                .order(
                    'part',
                    {
                        ascending:true
                    }
                );


        if(error){

            container.innerHTML = `

                <div class="admin-card">
                    تعذر تحميل الملازم.
                </div>

            `;

            return;

        }


        if(!data || !data.length){

            container.innerHTML = `

                <div class="admin-card">

                    <strong>
                        لا توجد ملازم مضافة حالياً.
                    </strong>

                    <p style="
                        color:#64748b;
                        font-size:11px;
                        margin-top:7px;
                    ">

                        سيتم عرض الملازم هنا
                        عند إضافتها من لوحة الإدارة.

                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = '';


        data.forEach(
            item=>{

                container.appendChild(
                    createMaterialElement(
                        item
                    )
                );

            }
        );

    }catch(error){

        console.error(error);

    }

}


function createMaterialElement(
    material
){

    const div =
        document.createElement(
            'div'
        );


    div.className =
        'material';


    const part =
        Number(material.part) === 2
            ? 'الجزء الثاني'
            : 'الجزء الأول';


    div.innerHTML = `

        <div class="material-icon">
            📕
        </div>

        <div class="material-info">

            <h4>
                ${escapeHtml(
                    material.title ||
                    'ملزمة'
                )}
            </h4>

            <span>
                ${part}
            </span>

        </div>

        <button
            class="material-btn"
            onclick="openMaterial('${escapeAttr(
                material.url || ''
            )}')"
        >
            فتح
        </button>

    `;


    return div;

}


function openMaterial(url){

    if(!url){

        showToast(
            'رابط الملزمة غير متوفر'
        );

        return;

    }


    window.open(
        url,
        '_blank',
        'noopener,noreferrer'
    );

}

function adminTab(tab){

    const tabs = [
        'announcement',
        'material',
        'lecture',
        'teacher',
        'code',
        'students'
    ];


    tabs.forEach(
        name=>{

                $('admin-' + name);


            if(box){

                box.style.display =
                    name === tab
                        ? 'block'
                        : 'none';

            }

        }
    );


    document
        .querySelectorAll(
            '.admin-tab'
        )
        .forEach(
            btn=>{
                btn.classList.remove(
                    'active'
                );
            }
        );


    const names = {

        announcement:'إعلان',

        material:'ملزمة',

        lecture:'محاضرة',

        teacher:'مدرس',

        code:'كود',

        students:'الطلاب'

    };


    document
        .querySelectorAll(
            '.admin-tab'
        )
        .forEach(
            btn=>{

                if(
                    btn.textContent
                        .trim()
                        .includes(
                            names[tab]
                        )

                        'active'
                    );

/* =========================================================
   CODE GENERATOR
========================================================= */

function generateRandomCode(){

    const chars =
        'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';


    let result = '';


    for(
        let i=0;
        i<12;
        i++
    ){

        result +=
            chars.charAt(
                Math.floor(
                    Math.random() *
                    chars.length
                )
            );

    }


    return result;

}

                            <br>

                            <small style="

                                ${escapeHtml(
                                    student.student_number || '-'

                            ${escapeHtml(
                                student.governorate || '-'
                            )}

                            <br>

                            <small style="
                                color:#64748b;
                            ">

                                ${escapeHtml(
                                    gradeData[
                                        student.grade
                                    ]?.title ||
                                    student.grade ||
                                    '-'
                                )}

                            </small>

                        </td>


                        <td>

                            التسجيل:
                            ${created}

                            <br>

                            آخر دخول:

async function countTable(
    table
){

    try{

        const {
            count,
            error
        } =
            await db
                .from(table)
                .select(
                    '*',
                    {
                        count:'exact',
                        head:true
                    }
                );


        if(error){

            return 0;

        }


        return count || 0;

    }catch(error){

        return 0;

    }

}

   SEARCH
========================================================= */

function performSearch(){

    const query =
        $('searchInput')
            .value
            .trim()
            .toLowerCase();


    const allCards =
        document.querySelectorAll(
            '.material,.subject-card,.grade-card'
        );


    if(!query){

        allCards.forEach(
            card=>{
                card.style.display = '';
            }
        );

        return;

    }


    allCards.forEach(
        card=>{

            const text =
                card.textContent
                    .toLowerCase();


            card.style.display =
                text.includes(query)
                    ? ''
                    : 'none';

        }
    );

}


/* =========================================================
   SECURITY HELPERS
========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


function escapeAttr(value){

    return String(value)

        .replace(
            /\\/g,
            '\\\\'
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '&quot;'
        );

}
