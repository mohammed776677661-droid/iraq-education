<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>منصة العراق التعليمية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --accent:#f59e0b;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#6b7280;
    --line:#e7eaf0;
    --success:#16a34a;
    --danger:#dc2626;
    --shadow:0 10px 30px rgba(23,32,51,.07);
    --radius:20px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:"Cairo",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

/* HEADER */

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    min-height:74px;
    display:flex;
    align-items:center;
}

.topbar-inner{
    width:min(1450px,94%);
    margin:auto;
    display:flex;
    align-items:center;
    gap:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:20px;
    white-space:nowrap;
}

.brand-mark{
    width:42px;
    height:42px;
    border-radius:13px;
    display:grid;
    place-items:center;
    color:#fff;
    background:linear-gradient(135deg,var(--primary),#60a5fa);
    box-shadow:0 8px 18px rgba(37,99,235,.25);
}

.brand small{
    display:block;
    color:var(--muted);
    font-size:10px;
    font-weight:600;
}

.search{
    flex:1;
    max-width:560px;
    margin:auto;
    position:relative;
}

.search input{
    width:100%;
    height:46px;
    border:1px solid var(--line);
    outline:none;
    background:#f8fafc;
    border-radius:14px;
    padding:0 46px 0 16px;
}

.search i{
    position:absolute;
    right:17px;
    top:14px;
    color:#94a3b8;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn,
.avatar{
    width:42px;
    height:42px;
    border-radius:13px;
    border:1px solid var(--line);
    background:#fff;
    display:grid;
    place-items:center;
    color:#46526a;
}

.avatar{
    background:#dbeafe;
    border-color:#bfdbfe;
    color:#1d4ed8;
    font-weight:800;
}

/* LAYOUT */

.layout{
    width:min(1450px,94%);
    margin:22px auto;
    display:grid;
    grid-template-columns:260px 1fr;
    gap:22px;
}

.sidebar{
    background:#0f172a;
    color:#fff;
    border-radius:24px;
    padding:20px;
    min-height:calc(100vh - 118px);
    position:sticky;
    top:96px;
    box-shadow:var(--shadow);
}

.sidebar-inner{
    display:flex;
    flex-direction:column;
    height:100%;
}

.side-title{
    font-size:12px;
    color:#94a3b8;
    margin:18px 8px 10px;
}

.nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 12px;
    border-radius:13px;
    color:#cbd5e1;
    transition:.2s;
    margin-bottom:5px;
}

.nav-item:hover,
.nav-item.active{
    background:#1e293b;
    color:#fff;
}

.nav-item.active{
    box-shadow:inset -3px 0 0 #60a5fa;
}

.nav-item i{
    width:20px;
    text-align:center;
}

.side-bottom{
    margin-top:auto;
}

.main{
    min-width:0;
}

/* HERO */

.hero{
    background:linear-gradient(120deg,#1d4ed8,#2563eb 55%,#60a5fa);
    color:#fff;
    border-radius:24px;
    padding:30px;
    display:grid;
    grid-template-columns:1.4fr .9fr;
    gap:20px;
    overflow:hidden;
    position:relative;
    box-shadow:0 18px 36px rgba(37,99,235,.18);
}

.hero h1{
    font-size:32px;
    line-height:1.4;
    margin:0 0 8px;
    position:relative;
    z-index:1;
}

.hero p{
    color:#dbeafe;
    margin:0 0 20px;
    max-width:700px;
    position:relative;
    z-index:1;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.hero-card{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);
    border-radius:20px;
    padding:20px;
    backdrop-filter:blur(10px);
}

.hero-card-title{
    font-weight:700;
    margin-bottom:14px;
}

.progress{
    height:9px;
    border-radius:20px;
    background:#e5e7eb;
    overflow:hidden;
}

.progress > span{
    display:block;
    height:100%;
    background:var(--primary);
    border-radius:20px;
}

.hero-card .progress{
    background:rgba(255,255,255,.22);
}

.hero-card .progress > span{
    background:#fff;
}

.hero-stat{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#dbeafe;
    margin-top:9px;
}

    border-radius:13px;
    padding:11px 17px;
    font-weight:
